spring.application.name=api-funcionarios

server.port=8084


spring.datasource.url=jdbc:mysql://${HOST}:3306/${DB}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración HikariCP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=90000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-1


# Validar el esquema sin crear, alterar ni eliminar tablas al arrancar.
# Los cambios de esquema se aplican manualmente, con respaldo previo.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


api.departamento-url=${DEPARTAMENTOS}

api.funcionario-smc-url=${FUNCIONARIOS}

# Detener el inicio ante errores de validación del esquema.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true

# Correlación de eventos por petición. No registrar query strings ni cuerpos HTTP.
logging.pattern.level=%5p [request_id=%X{requestId:-none}]
logging.level.com.apifuncionarios.api_funcionarios=INFO
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
